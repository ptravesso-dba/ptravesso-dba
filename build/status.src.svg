<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Status: Pablo Travesso</title>
<desc id="d">Character sheet in the style of a souls-like status screen: class Oracle DBA, attributes, equipment and certifications.</desc>
<style>
<!--FONTS:cinzel700,cinzel500,jbm400,jbm700-->
.disp { font-family: "Cinzel", "Trajan Pro", "Times New Roman", serif; }
.mono { font-family: "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
.h { font-family: "Cinzel", serif; font-weight: 700; font-size: 17px; letter-spacing: 4px; fill: #e8833a; }
.k { font-size: 15px; fill: #9b8d78; }
.v { font-size: 15px; fill: #eadcc5; }
.n { font-size: 15px; fill: #eadcc5; font-weight: 700; }
.small { font-size: 13px; fill: #9b8d78; }
.bar { animation: fill 1.6s cubic-bezier(.2,.7,.2,1) backwards; transform-box: fill-box; transform-origin: 0 50%; }
@keyframes fill { from { transform: scaleX(0); } }
.glint { animation: glint 5s ease-in-out infinite; }
@keyframes glint { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bar, .glint { animation: none; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#110d0b"/><stop offset="1" stop-color="#0c0a09"/></linearGradient>
  <radialGradient id="pit" cx="50%" cy="115%" r="70%"><stop offset="0" stop-color="#8c3b15" stop-opacity=".35"/><stop offset="1" stop-color="#8c3b15" stop-opacity="0"/></radialGradient>
  <linearGradient id="barG" x1="0" x2="1"><stop offset="0" stop-color="#8c3b15"/><stop offset="1" stop-color="#e8833a"/></linearGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#eadcc5" stop-opacity="0"/><stop offset=".5" stop-color="#eadcc5" stop-opacity=".35"/><stop offset="1" stop-color="#eadcc5" stop-opacity="0"/></linearGradient>
  <g id="diamond"><path d="M0-5 5 0 0 5-5 0z" fill="#e8833a"/></g>
</defs>

<rect width="1200" height="600" rx="14" fill="url(#bg)"/>
<rect width="1200" height="600" rx="14" fill="url(#pit)"/>
<!-- ornate double frame -->
<rect x=".5" y=".5" width="1199" height="599" rx="14" fill="none" stroke="#eadcc5" stroke-opacity=".14"/>
<rect x="14.5" y="14.5" width="1171" height="571" rx="6" fill="none" stroke="#eadcc5" stroke-opacity=".08"/>
<use href="#diamond" x="15" y="15" class="glint"/><use href="#diamond" x="1185" y="15" class="glint"/>
<use href="#diamond" x="15" y="585" class="glint"/><use href="#diamond" x="1185" y="585" class="glint"/>

<!-- title -->
<text x="600" y="62" text-anchor="middle" class="disp" font-weight="700" font-size="26" letter-spacing="10" fill="#eadcc5">STATUS</text>
<rect x="300" y="78" width="600" height="1" fill="url(#rule)"/>

<!-- column 1: identity -->
<g transform="translate(60 120)">
  <text class="h" y="0">CHARACTER</text>
  <rect y="12" width="300" height="1" fill="#eadcc5" opacity=".12"/>
  <g class="mono">
    <text class="k" y="46">Name</text>      <text class="v" x="300" y="46" text-anchor="end">Pablo Travesso</text>
    <text class="k" y="78">Class</text>     <text class="v" x="300" y="78" text-anchor="end">Oracle DBA</text>
    <text class="k" y="110">Level</text>    <text class="n" x="300" y="110" text-anchor="end" fill="#e8833a">19c</text>
    <text class="k" y="142">Covenant</text> <text class="v" x="300" y="142" text-anchor="end">TOTVS</text>
    <text class="k" y="174">Origin</text>   <text class="v" x="300" y="174" text-anchor="end">Ribeirão Preto · BR</text>
    <text class="k" y="206">Since</text>    <text class="v" x="300" y="206" text-anchor="end">2022 · on call</text>
    <text class="k" y="238">Gift</text>     <text class="v" x="300" y="238" text-anchor="end">ADS degree · UNIP</text>
  </g>
  <text class="h" y="300">RINGS</text>
  <rect y="312" width="300" height="1" fill="#eadcc5" opacity=".12"/>
  <g class="mono">
    <!--RINGS-->
  </g>
</g>

<!-- column 2: attributes -->
<g transform="translate(430 120)">
  <text class="h" y="0">ATTRIBUTES</text>
  <rect y="12" width="340" height="1" fill="#eadcc5" opacity=".12"/>
  <g class="mono">
    <!--ATTRS-->
  </g>
</g>

<!-- column 3: equipment -->
<g transform="translate(840 120)">
  <text class="h" y="0">EQUIPMENT</text>
  <rect y="12" width="300" height="1" fill="#eadcc5" opacity=".12"/>
  <g class="mono">
    <!--EQUIP-->
  </g>
</g>

<rect x="300" y="532" width="600" height="1" fill="url(#rule)"/>
<text x="600" y="562" text-anchor="middle" class="disp" font-weight="500" font-style="italic" font-size="16" letter-spacing="1" fill="#9b8d78">“Keeping production up while you sleep.”</text>
</svg>
